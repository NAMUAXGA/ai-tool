<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전사 AI Tool 구독현황_나무에이엑스</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold">
                    <i class="fa-solid me-1 fa-robot"></i> AI
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">전사 AI Tool 구독현황_나무에이엑스</h1>
                    <p class="text-xs text-slate-500 flex items-center gap-1">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Google Sheets 실시간 연동 대시보드
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="fetchSheetData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5 border border-slate-200">
                    <i class="fa-solid fa-rotate text-xs"></i> 새로고침
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- 필터 영역 -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-3 items-center justify-between">
            <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
                <select id="deptFilter" onchange="renderData()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 font-medium">
                    <option value="">전체 본부</option>
                </select>

                <select id="typeFilter" onchange="renderData()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 font-medium">
                    <option value="">전체 구분</option>
                    <option value="개인">개인</option>
                    <option value="팀">팀</option>
                    <option value="공용">공용</option>
                </select>

                <select id="programFilter" onchange="renderData()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 font-medium">
                    <option value="">전체 프로그램</option>
                </select>

                <div class="relative flex-1 md:w-48">
                    <input type="text" id="searchInput" oninput="renderData()" placeholder="사용자/용도 검색" 
                           class="w-full pl-3 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                </div>
            </div>

            <div class="text-xs text-slate-500 font-medium">
                조회결과: <strong id="filtered-count" class="text-indigo-600 text-sm">0</strong>건
            </div>
        </div>

        <!-- Google Sheet URL 바 (연도 설정 지원) -->
        <div id="sheetUrlConfig" class="bg-indigo-50 border border-indigo-200 rounded-xl p-4 shadow-sm">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-link text-indigo-600"></i>
                    <span class="text-xs font-bold text-indigo-950">구글 시트 CSV URL (2026년):</span>
                </div>
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/.../pub?output=csv" 
                           class="w-full md:w-96 px-3 py-1.5 bg-white border border-indigo-200 rounded-lg text-xs text-slate-700">
                    <button onclick="saveSheetUrl()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-lg font-semibold shrink-0">
                        연동하기
                    </button>
                </div>
            </div>
        </div>

        <!-- KPI 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">총 구독 건수</p>
                    <h2 id="kpi-total-count" class="text-2xl font-extrabold text-slate-900 mt-1">0건</h2>
                </div>
                <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center text-lg"><i class="fa-solid fa-list-check"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">현재 총액 (누적)</p>
                    <h2 id="kpi-total-cost" class="text-2xl font-extrabold text-emerald-600 mt-1">$0.00</h2>
                </div>
                <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center text-lg"><i class="fa-solid fa-dollar-sign"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">최대 지출 본부</p>
                    <h2 id="kpi-top-dept" class="text-2xl font-extrabold text-slate-900 mt-1">-</h2>
                </div>
                <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center text-lg"><i class="fa-solid fa-building"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">인기 AI Tool</p>
                    <h2 id="kpi-top-tool" class="text-2xl font-extrabold text-slate-900 mt-1">-</h2>
                </div>
                <div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-lg flex items-center justify-center text-lg"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            </div>
        </div>

        <!-- 📈 1월~12월 본부별 결제금액 추이 차트 -->
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <h3 class="text-sm font-bold text-slate-800 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-indigo-600"></i> 월별(1월~12월) 본부별 소요금액 추이
            </h3>
            <p class="text-xs text-slate-400 mb-4">시트에 기재된 1월~12월 각 월별 금액 기준 본부 지출 추이 ($)</p>
            <div class="relative h-72">
                <canvas id="monthlyDeptChart"></canvas>
            </div>
        </div>

        <!-- 서브 차트 2종 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="text-sm font-bold text-slate-800 mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-chart-column text-indigo-500"></i> 프로그램별 구독 수량
                </h3>
                <div class="relative h-60"><canvas id="toolChart"></canvas></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="text-sm font-bold text-slate-800 mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-indigo-500"></i> 본부별 누적 비용 비중
                </h3>
                <div class="relative h-60"><canvas id="deptChart"></canvas></div>
            </div>
        </div>

        <!-- 상세 목록 표 (시트 실제 컬럼 전체 반영) -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200 text-xs">
                        <tr>
                            <th class="py-3 px-4">No.</th>
                            <th class="py-3 px-4">구분</th>
                            <th class="py-3 px-4">프로그램명</th>
                            <th class="py-3 px-4">버전</th>
                            <th class="py-3 px-4">시작일</th>
                            <th class="py-3 px-4">사용용도</th>
                            <th class="py-3 px-4">본부</th>
                            <th class="py-3 px-4">사용자</th>
                            <th class="py-3 px-4">수량</th>
                            <th class="py-3 px-4">결제형태</th>
                            <th class="py-3 px-4 bg-emerald-50 text-emerald-800 font-bold">총액(현재기준)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let RAW_DATA = [];
        let deptChartInstance = null;
        let toolChartInstance = null;
        let monthlyDeptChartInstance = null;

        const MONTH_KEYS = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];

        window.onload = function() {
            const savedUrl = localStorage.getItem('googleSheetCsvUrl');
            if(savedUrl) {
                document.getElementById('sheetUrlInput').value = savedUrl;
                fetchSheetData();
            }
        };

        function saveSheetUrl() {
            const url = document.getElementById('sheetUrlInput').value.trim();
            if(!url) return alert('URL을 입력하세요');
            localStorage.setItem('googleSheetCsvUrl', url);
            fetchSheetData();
        }

        function cleanNumber(val) {
            if(!val) return 0;
            return parseFloat(val.toString().replace(/[^0-9.]/g, '')) || 0;
        }

        function fetchSheetData() {
            const sheetUrl = localStorage.getItem('googleSheetCsvUrl') || document.getElementById('sheetUrlInput').value.trim();
            if (!sheetUrl) return;

            Papa.parse(sheetUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if(results.data) {
                        RAW_DATA = results.data.filter(row => row['프로그램명'] || row['사용자']).map((row, idx) => {
                            const qty = parseInt(row['수량'] || 1) || 1;
                            
                            // 1월~12월 결제금액 파싱
                            const monthlyCosts = {};
                            MONTH_KEYS.forEach(m => {
                                monthlyCosts[m] = cleanNumber(row[m]);
                            });

                            // 총액(현재기준) 열 파싱, 없으면 월별 합산으로 대체
                            let totalCost = cleanNumber(row['총액(현재기준)'] || row['총액']);
                            if(totalCost === 0) {
                                totalCost = Object.values(monthlyCosts).reduce((a, b) => a + b, 0);
                            }

                            return {
                                no: parseInt(row['No.'] || (idx + 1)),
                                type: row['구분'] || '개인',
                                program: row['프로그램명'] || '-',
                                version: row['버전'] || '-',
                                startDate: row['시작일'] || '-',
                                usage: row['사용용도'] || '-',
                                dept: row['본부'] || '미분류',
                                user: row['사용자'] || '-',
                                qty: qty,
                                paymentType: row['결제형태'] || '월구독',
                                monthly: monthlyCosts,
                                total: totalCost
                            };
                        });

                        initFilters();
                        renderData();
                    }
                }
            });
        }

        function initFilters() {
            const deptSelect = document.getElementById('deptFilter');
            const programSelect = document.getElementById('programFilter');

            const depts = [...new Set(RAW_DATA.map(d => d.dept))].filter(Boolean);
            const programs = [...new Set(RAW_DATA.map(d => d.program))].filter(Boolean);

            deptSelect.innerHTML = '<option value="">전체 본부</option>';
            depts.forEach(d => deptSelect.innerHTML += `<option value="${d}">${d}</option>`);

            programSelect.innerHTML = '<option value="">전체 프로그램</option>';
            programs.forEach(p => programSelect.innerHTML += `<option value="${p}">${p}</option>`);
        }

        function renderData() {
            const dept = document.getElementById('deptFilter').value;
            const type = document.getElementById('typeFilter').value;
            const program = document.getElementById('programFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filtered = RAW_DATA.filter(item => {
                const matchesDept = !dept || item.dept === dept;
                const matchesType = !type || item.type === type;
                const matchesProgram = !program || item.program === program;
                const matchesSearch = item.user.toLowerCase().includes(search) || 
                                      item.program.toLowerCase().includes(search) ||
                                      item.usage.toLowerCase().includes(search);

                return matchesDept && matchesType && matchesProgram && matchesSearch;
            });

            // 표 그리기 (이미지 시트 데이터 완벽 매칭)
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 border-b border-slate-100";
                tr.innerHTML = `
                    <td class="py-2.5 px-4 font-mono text-xs text-slate-400">${item.no}</td>
                    <td class="py-2.5 px-4 text-xs">${item.type}</td>
                    <td class="py-2.5 px-4 font-semibold text-slate-900">${item.program}</td>
                    <td class="py-2.5 px-4 text-xs text-slate-500">${item.version}</td>
                    <td class="py-2.5 px-4 text-xs font-mono text-slate-500">${item.startDate}</td>
                    <td class="py-2.5 px-4 text-xs text-slate-600">${item.usage}</td>
                    <td class="py-2.5 px-4 text-xs font-medium">${item.dept}</td>
                    <td class="py-2.5 px-4 text-xs text-slate-800">${item.user}</td>
                    <td class="py-2.5 px-4 text-xs font-mono">${item.qty}</td>
                    <td class="py-2.5 px-4 text-xs text-slate-500">${item.paymentType}</td>
                    <td class="py-2.5 px-4 text-xs font-mono font-bold text-emerald-600 bg-emerald-50/50">$${item.total.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('filtered-count').innerText = filtered.length;

            updateKPIs(filtered);
            updateCharts(filtered);
            renderMonthlyDeptChart(filtered);
        }

        function updateKPIs(data) {
            const totalCount = data.length;
            const totalCost = data.reduce((acc, curr) => acc + curr.total, 0);

            const deptTotals = {};
            const toolCounts = {};
            data.forEach(d => {
                deptTotals[d.dept] = (deptTotals[d.dept] || 0) + d.total;
                toolCounts[d.program] = (toolCounts[d.program] || 0) + d.qty;
            });

            const topDept = Object.keys(deptTotals).length ? Object.keys(deptTotals).reduce((a, b) => deptTotals[a] > deptTotals[b] ? a : b) : '-';
            const topTool = Object.keys(toolCounts).length ? Object.keys(toolCounts).reduce((a, b) => toolCounts[a] > toolCounts[b] ? a : b) : '-';

            document.getElementById('kpi-total-count').innerText = totalCount + '건';
            document.getElementById('kpi-total-cost').innerText = '$' + totalCost.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('kpi-top-dept').innerText = topDept;
            document.getElementById('kpi-top-tool').innerText = topTool;
        }

        function updateCharts(data) {
            const deptData = {};
            const toolData = {};

            data.forEach(d => {
                deptData[d.dept] = (deptData[d.dept] || 0) + d.total;
                toolData[d.program] = (toolData[d.program] || 0) + d.qty;
            });

            if(deptChartInstance) deptChartInstance.destroy();
            if(toolChartInstance) toolChartInstance.destroy();

            toolChartInstance = new Chart(document.getElementById('toolChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(toolData),
                    datasets: [{ label: '구독 수량', data: Object.values(toolData), backgroundColor: '#6366f1' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            deptChartInstance = new Chart(document.getElementById('deptChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(deptData),
                    datasets: [{ data: Object.values(deptData), backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#3b82f6', '#14b8a6'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderMonthlyDeptChart(data) {
            const depts = [...new Set(data.map(d => d.dept))].filter(Boolean);
            const colors = ['#6366f1', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#3b82f6', '#14b8a6'];

            const datasets = depts.map((dept, idx) => {
                const monthValues = MONTH_KEYS.map(m => {
                    return data
                        .filter(d => d.dept === dept)
                        .reduce((sum, item) => sum + (item.monthly[m] || 0), 0);
                });

                return {
                    label: dept,
                    data: monthValues,
                    borderColor: colors[idx % colors.length],
                    backgroundColor: colors[idx % colors.length],
                    tension: 0.3,
                    fill: false
                };
            });

            if(monthlyDeptChartInstance) monthlyDeptChartInstance.destroy();

            monthlyDeptChartInstance = new Chart(document.getElementById('monthlyDeptChart'), {
                type: 'line',
                data: {
                    labels: MONTH_KEYS,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { callback: value => '$' + value }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
