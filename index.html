<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전사 AI Tool 구독현황</title>
    <!-- Tailwind CSS & Chart.js & PapaParse & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">전사 AI Tool 구독현황</h1>
                    <p class="text-xs text-slate-500 flex items-center gap-1">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Google Sheets 실시간 연동 대시보드
                    </p>
                </div>
            </div>
            <button onclick="fetchSheetData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5 border border-slate-200">
                <i class="fa-solid fa-rotate"></i> 새로고침
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- 필터 영역 -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-3 items-center justify-between">
            <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
                <select id="deptFilter" onchange="renderData()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-700 font-medium">
                    <option value="">전체 본부</option>
                </select>

                <select id="typeFilter" onchange="renderData()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-700 font-medium">
                    <option value="">전체 구분</option>
                    <option value="개인">개인</option>
                    <option value="팀">팀</option>
                    <option value="공용">공용</option>
                </select>

                <select id="programFilter" onchange="renderData()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-700 font-medium">
                    <option value="">전체 프로그램</option>
                </select>

                <div class="relative flex-1 md:w-48">
                    <input type="text" id="searchInput" oninput="renderData()" placeholder="사용자/용도/프로그램 검색" 
                           class="w-full pl-3 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                </div>
            </div>

            <div class="text-xs text-slate-500 font-medium">
                유효 계약 건수: <strong id="filtered-count" class="text-indigo-600 text-sm">0</strong>건
            </div>
        </div>

        <!-- Google Sheet URL 입력 바 -->
        <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-4 shadow-sm">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-link text-indigo-600"></i>
                    <span class="text-xs font-bold text-indigo-950">구글 시트 CSV URL:</span>
                </div>
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/.../pub?output=csv" 
                           class="w-full md:w-96 px-3 py-1.5 bg-white border border-indigo-200 rounded-lg text-xs text-slate-700">
                    <button onclick="saveSheetUrl()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-lg font-semibold shrink-0">
                        연동하기
                    </button>
                </div>
            </div>
        </div>

        <!-- KPI 카드 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-medium text-slate-500">현재 유효 구독 수량</p>
                <h2 id="kpi-total-count" class="text-xl font-extrabold text-slate-900 mt-1">0개</h2>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm bg-indigo-50/30 border-indigo-100">
                <p class="text-xs font-medium text-indigo-600 font-bold">월 총 구독비용 (최근월)</p>
                <h2 id="kpi-monthly-cost" class="text-xl font-extrabold text-indigo-700 mt-1">$0.00</h2>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-medium text-slate-500">총 연간 지출액</p>
                <h2 id="kpi-total-cost" class="text-xl font-extrabold text-emerald-600 mt-1">$0.00</h2>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-medium text-slate-500">최대 지출 본부</p>
                <h2 id="kpi-top-dept" class="text-xl font-extrabold text-slate-900 mt-1">-</h2>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-medium text-slate-500">인기 AI Tool</p>
                <h2 id="kpi-top-tool" class="text-xl font-extrabold text-slate-900 mt-1">-</h2>
            </div>
        </div>

        <!-- 상세 목록 표 (퇴사자 제외) -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="text-xs font-bold text-slate-700">현재 유효 구독 목록 (퇴사자 제외)</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200 text-xs">
                        <tr>
                            <th class="py-3 px-3 text-center">No.</th>
                            <th class="py-3 px-3">구분</th>
                            <th class="py-3 px-3">프로그램명</th>
                            <th class="py-3 px-3">버전</th>
                            <th class="py-3 px-3">시작일</th>
                            <th class="py-3 px-3">사용용도</th>
                            <th class="py-3 px-3">본부</th>
                            <th class="py-3 px-3">사용자</th>
                            <th class="py-3 px-3 text-center">수량</th>
                            <th class="py-3 px-3 text-right bg-slate-200/50">단가</th>
                            <th class="py-3 px-3 text-center">결제형태</th>
                            <th class="py-3 px-3 text-right bg-emerald-100/60 text-emerald-900 font-bold">연간사용액</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let RAW_DATA = [];
        const MONTH_KEYS = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];

        window.onload = function() {
            const savedUrl = localStorage.getItem('googleSheetCsvUrl');
            if (savedUrl) {
                document.getElementById('sheetUrlInput').value = savedUrl;
                fetchSheetData();
            }
        };

        function saveSheetUrl() {
            const url = document.getElementById('sheetUrlInput').value.trim();
            if(!url) return alert('URL을 입력해 주세요.');
            localStorage.setItem('googleSheetCsvUrl', url);
            fetchSheetData();
        }

        function cleanNumber(val) {
            if (val === null || val === undefined) return 0;
            const str = val.toString().replace(/[^0-9.-]/g, '');
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        function getValueByCandidateKeys(row, candidateKeys) {
            const rowKeys = Object.keys(row);
            for (let cand of candidateKeys) {
                const matchedKey = rowKeys.find(k => k.trim().replace(/\s+/g, '').toLowerCase() === cand.trim().replace(/\s+/g, '').toLowerCase());
                if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== '') {
                    return row[matchedKey];
                }
            }
            return '';
        }

        function fetchSheetData() {
            const sheetUrl = localStorage.getItem('googleSheetCsvUrl') || document.getElementById('sheetUrlInput').value.trim();
            if (!sheetUrl) return;

            Papa.parse(sheetUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                transformHeader: h => h ? h.trim().replace(/^[\uFEFF\xFFFE]/, '') : '',
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        RAW_DATA = results.data
                            .filter(row => getValueByCandidateKeys(row, ['프로그램명', '프로그램', 'Tool']) || getValueByCandidateKeys(row, ['사용자', '이름']))
                            .map((row, idx) => {
                                const qty = cleanNumber(getValueByCandidateKeys(row, ['수량', 'Qty'])) || 1;
                                
                                const monthlyCosts = {};
                                MONTH_KEYS.forEach(m => {
                                    monthlyCosts[m] = cleanNumber(getValueByCandidateKeys(row, [m, m.replace('월', '')]));
                                });

                                // 연간사용액 키 인식
                                let totalCost = cleanNumber(getValueByCandidateKeys(row, ['연간사용액', '연간 사용액', '총액(현재기준)', '총액', '합계', 'Total']));
                                const sumMonthly = Object.values(monthlyCosts).reduce((a, b) => a + b, 0);
                                if (totalCost === 0) totalCost = sumMonthly;

                                let unitPrice = cleanNumber(getValueByCandidateKeys(row, ['단가', '월단가', 'Price']));
                                if (unitPrice === 0) {
                                    const activeMonth = Object.values(monthlyCosts).find(v => v > 0);
                                    unitPrice = activeMonth ? (activeMonth / qty) : (totalCost / qty);
                                }

                                const isRetired = JSON.stringify(row).includes('퇴사');

                                return {
                                    no: parseInt(getValueByCandidateKeys(row, ['No.', 'No', '순번'])) || (idx + 1),
                                    type: getValueByCandidateKeys(row, ['구분', 'Type']) || '개인',
                                    program: getValueByCandidateKeys(row, ['프로그램명', '프로그램']) || '-',
                                    version: getValueByCandidateKeys(row, ['버전', 'Version']) || '-',
                                    startDate: getValueByCandidateKeys(row, ['시작일']) || '-',
                                    usage: getValueByCandidateKeys(row, ['사용용도', '용도']) || '-',
                                    dept: getValueByCandidateKeys(row, ['본부', '부서']) || '미분류',
                                    user: getValueByCandidateKeys(row, ['사용자', '이름']) || '-',
                                    qty: qty,
                                    unitPrice: unitPrice,
                                    paymentType: getValueByCandidateKeys(row, ['결제형태', '결제방식']) || '월구독',
                                    monthly: monthlyCosts,
                                    total: totalCost,
                                    isRetired: isRetired
                                };
                            });

                        initFilters();
                        renderData();
                    }
                }
            });
        }

        function initFilters() {
            const deptSelect = document.getElementById('deptFilter');
            const programSelect = document.getElementById('programFilter');

            const activeData = RAW_DATA.filter(d => !d.isRetired);
            const depts = [...new Set(activeData.map(d => d.dept))].filter(Boolean);
            const programs = [...new Set(activeData.map(d => d.program))].filter(Boolean);

            deptSelect.innerHTML = '<option value="">전체 본부</option>';
            depts.forEach(d => deptSelect.innerHTML += `<option value="${d}">${d}</option>`);

            programSelect.innerHTML = '<option value="">전체 프로그램</option>';
            programs.forEach(p => programSelect.innerHTML += `<option value="${p}">${p}</option>`);
        }

        function renderData() {
            const dept = document.getElementById('deptFilter').value;
            const type = document.getElementById('typeFilter').value;
            const program = document.getElementById('programFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filteredAll = RAW_DATA.filter(item => {
                const matchesDept = !dept || item.dept === dept;
                const matchesType = !type || item.type === type;
                const matchesProgram = !program || item.program === program;
                const matchesSearch = item.user.toLowerCase().includes(search) || 
                                      item.program.toLowerCase().includes(search) ||
                                      item.usage.toLowerCase().includes(search);

                return matchesDept && matchesType && matchesProgram && matchesSearch;
            });

            // 퇴사자 제외 목록
            const filteredActive = filteredAll.filter(item => !item.isRetired);

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            filteredActive.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 border-b border-slate-100";
                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-center font-mono text-xs text-slate-400">${item.no}</td>
                    <td class="py-2.5 px-3 text-xs">${item.type}</td>
                    <td class="py-2.5 px-3 font-semibold text-slate-900">${item.program}</td>
                    <td class="py-2.5 px-3 text-xs text-slate-500">${item.version}</td>
                    <td class="py-2.5 px-3 text-xs font-mono text-slate-500">${item.startDate}</td>
                    <td class="py-2.5 px-3 text-xs text-slate-600">${item.usage}</td>
                    <td class="py-2.5 px-3 text-xs font-medium">${item.dept}</td>
                    <td class="py-2.5 px-3 text-xs text-slate-800">${item.user}</td>
                    <td class="py-2.5 px-3 text-center text-xs font-mono font-bold">${item.qty}</td>
                    <td class="py-2.5 px-3 text-right text-xs font-mono font-medium text-slate-700 bg-slate-50/50">$${item.unitPrice.toFixed(2)}</td>
                    <td class="py-2.5 px-3 text-center text-xs text-slate-500">${item.paymentType}</td>
                    <td class="py-2.5 px-3 text-right text-xs font-mono font-bold text-emerald-600 bg-emerald-50/40">$${item.total.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('filtered-count').innerText = filteredActive.length;
            updateKPIs(filteredAll, filteredActive);
        }

        function updateKPIs(allData, activeData) {
            const activeQtyTotal = activeData.reduce((acc, curr) => acc + curr.qty, 0);
            const totalCost = activeData.reduce((acc, curr) => acc + curr.total, 0);

            const monthlyTotals = MONTH_KEYS.map(m => activeData.reduce((sum, item) => sum + (item.monthly[m] || 0), 0));
            const activeMonthlyTotals = monthlyTotals.filter(v => v > 0);
            const latestMonthlyCost = activeMonthlyTotals.length > 0 ? activeMonthlyTotals[activeMonthlyTotals.length - 1] : 0;

            const deptTotals = {};
            const toolCounts = {};
            activeData.forEach(d => {
                deptTotals[d.dept] = (deptTotals[d.dept] || 0) + d.total;
                toolCounts[d.program] = (toolCounts[d.program] || 0) + d.qty;
            });

            const topDept = Object.keys(deptTotals).length ? Object.keys(deptTotals).reduce((a, b) => deptTotals[a] > deptTotals[b] ? a : b) : '-';
            const topTool = Object.keys(toolCounts).length ? Object.keys(toolCounts).reduce((a, b) => toolCounts[a] > toolCounts[b] ? a : b) : '-';

            document.getElementById('kpi-total-count').innerText = activeQtyTotal + '개';
            document.getElementById('kpi-monthly-cost').innerText = '$' + latestMonthlyCost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('kpi-total-cost').innerText = '$' + totalCost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('kpi-top-dept').innerText = topDept;
            document.getElementById('kpi-top-tool').innerText = topTool;
        }
    </script>
</body>
</html>
